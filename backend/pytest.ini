[pytest]
testpaths = tests
# Lets tests do `import app` when pytest runs from backend/
pythonpath = .
# Every `async def test_...` runs on an event loop without needing a marker
asyncio_mode = auto
# Third-party deprecation inside Starlette, not our code
filterwarnings =
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning
